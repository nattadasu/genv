version: '3'

vars:
  BINARY_NAME: genv
  BUILD_DIR: build
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install-deps:
    desc: Install Go dependencies
    cmds:
      - go mod download
      - go mod tidy

  build:
    desc: Build the binary for current platform
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY_NAME}} ./cmd/genv
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY_NAME}}"

  build-all:
    desc: Build binaries for all platforms
    cmds:
      - task: build-linux
      - task: build-macos
      - task: build-windows

  build-linux:
    desc: Build for Linux (amd64 and arm64)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-linux-amd64 ./cmd/genv
      - GOOS=linux GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-linux-arm64 ./cmd/genv

  build-macos:
    desc: Build for macOS (amd64 and arm64)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=darwin GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-darwin-amd64 ./cmd/genv
      - GOOS=darwin GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-darwin-arm64 ./cmd/genv

  build-windows:
    desc: Build for Windows (amd64 and arm64)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-windows-amd64.exe ./cmd/genv
      - GOOS=windows GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}}-windows-arm64.exe ./cmd/genv

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  test-short:
    desc: Run tests without verbose output
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint (requires golangci-lint to be installed)
    cmds:
      - golangci-lint run ./...
    preconditions:
      - sh: command -v golangci-lint
        msg: "golangci-lint is not installed. Install from https://golangci-lint.run/usage/install/"

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f {{.BINARY_NAME}}
      - rm -rf {{.BUILD_DIR}}
      - rm -f coverage.out coverage.html

  install:
    desc: Install the binary to $GOPATH/bin
    deps:
      - build
    cmds:
      - go install ./cmd/genv

  demo:
    desc: Run demo of genv with all supported shells
    deps:
      - build
    cmds:
      - |
        echo "=== Demo: genv init for all shells ==="
        echo
        for shell in bash fish zsh sh ksh ash powershell nushell xonsh csh tcsh cmd ion rc; do
          echo "=== $shell ==="
          ./{{.BINARY_NAME}} init $shell | head -n 10
          echo
        done

  demo-shell:
    desc: "Run demo for specific shell (usage: task demo-shell SHELL=bash)"
    deps:
      - build
    cmds:
      - ./{{.BINARY_NAME}} init {{.SHELL}}

  run:
    desc: "Run the application (usage: task run -- init bash)"
    deps:
      - build
    cmds:
      - ./{{.BINARY_NAME}} {{.CLI_ARGS}}

  help:
    desc: Show help message
    deps:
      - build
    cmds:
      - ./{{.BINARY_NAME}} help

  version:
    desc: Show version
    deps:
      - build
    cmds:
      - ./{{.BINARY_NAME}} version

  check:
    desc: Run all checks (fmt, vet, test)
    cmds:
      - task: fmt
      - task: vet
      - task: test

  ci:
    desc: Run CI pipeline (install deps, check, build)
    cmds:
      - task: install-deps
      - task: check
      - task: build-all
