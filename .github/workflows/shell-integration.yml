name: Shell Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-shells-linux:
    name: Test Shells on Linux
    runs-on: ubuntu-latest
    outputs:
      bash_status: ${{ steps.set-outputs.outputs.bash_status }}
      sh_status: ${{ steps.set-outputs.outputs.sh_status }}
      ash_status: ${{ steps.set-outputs.outputs.ash_status }}
      zsh_status: ${{ steps.set-outputs.outputs.zsh_status }}
      ksh_status: ${{ steps.set-outputs.outputs.ksh_status }}
      fish_status: ${{ steps.set-outputs.outputs.fish_status }}
      tcsh_status: ${{ steps.set-outputs.outputs.tcsh_status }}

      pwsh_status: ${{ steps.set-outputs.outputs.pwsh_status }}
      nushell_status: ${{ steps.set-outputs.outputs.nushell_status }}
      xonsh_status: ${{ steps.set-outputs.outputs.xonsh_status }}
      elvish_status: ${{ steps.set-outputs.outputs.elvish_status }}
      ion_status: ${{ steps.set-outputs.outputs.ion_status }}
      rc_status: ${{ steps.set-outputs.outputs.rc_status }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build genv
      run: go build -o genv ./cmd/genv

    - name: Install dependencies
      run: sudo apt-get update

    - name: Install Bash
      continue-on-error: true
      run: sudo apt-get install -y bash

    - name: Install Zsh
      continue-on-error: true
      run: sudo apt-get install -y zsh

    - name: Install Ksh
      continue-on-error: true
      run: sudo apt-get install -y ksh

    - name: Install Tcsh
      continue-on-error: true
      run: sudo apt-get install -y tcsh

    - name: Install Fish
      continue-on-error: true
      run: sudo apt-get install -y fish

    - name: Install PowerShell
      continue-on-error: true
      run: sudo apt-get install -y powershell

    - name: Install Rc
      continue-on-error: true
      run: sudo apt-get install -y rc

    - name: Install Nushell
      continue-on-error: true
      run: |
        gh release download --repo nushell/nushell --pattern '*-x86_64-unknown-linux-gnu.tar.gz'
        tar xzf nu-*-x86_64-unknown-linux-gnu.tar.gz
        sudo mv nu-*/nu /usr/local/bin/
        nu --version
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Ion build
      uses: actions/cache@v4
      id: ion-cache
      with:
        path: ~/.cargo/bin/ion
        key: ion-shell-${{ runner.os }}-v1

    - name: Install Ion shell
      id: install_ion
      if: steps.ion-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      run: cargo install --git https://gitlab.redox-os.org/redox-os/ion/ ion-shell --locked

    - name: Setup Ion in PATH
      if: steps.ion-cache.outputs.cache-hit == 'true' || steps.install_ion.outcome == 'success'
      continue-on-error: true
      run: |
        if [ -f ~/.cargo/bin/ion ]; then
          sudo cp ~/.cargo/bin/ion /usr/local/bin/
          ion --version
        fi

    - name: Create test config
      run: |
        cat > test.env << 'EOF'
        EDITOR = "/usr/bin/vim"
        GENV_TEST = "integration"
        TEST_VALUE = "hello-world"
        GOPATH = "/opt/go"
        PATH = ["$PATH", "$GOPATH/bin", "/opt/bin"]
        EOF

    - name: Test Bash
      continue-on-error: true
      run: |
        if ! command -v bash &> /dev/null;
        then
          echo "BASH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Bash not found, skipping test."
          exit 0
        fi
        echo "=== Testing Bash ==="
        if bash -c 'eval "$(./genv init --path test.env bash)" && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration" && test "$TEST_VALUE" = "hello-world" && test "$GOPATH" = "/opt/go" && echo "$PATH" | grep -q "/opt/go/bin"'; then
          echo "BASH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Bash integration test passed"
        else
          echo "BASH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Bash integration test FAILED"
          exit 1
        fi

    - name: Test Zsh
      continue-on-error: true
      run: |
        if ! command -v zsh &> /dev/null;
        then
          echo "ZSH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Zsh not found, skipping test."
          exit 0
        fi
        echo "=== Testing Zsh ==="
        if zsh -c 'eval "$(./genv init --path test.env zsh)" && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration" && test "$TEST_VALUE" = "hello-world" && test "$GOPATH" = "/opt/go" && echo "$PATH" | grep -q "/opt/go/bin"'; then
          echo "ZSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Zsh integration test passed"
        else
          echo "ZSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Zsh integration test FAILED"
          exit 1
        fi

    - name: Test Ksh
      continue-on-error: true
      run: |
        if ! command -v ksh &> /dev/null;
        then
          echo "KSH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Ksh not found, skipping test."
          exit 0
        fi
        echo "=== Testing Ksh ==="
        if ksh -c 'eval "$(./genv init --path test.env ksh)" && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration" && test "$TEST_VALUE" = "hello-world" && test "$GOPATH" = "/opt/go" && echo "$PATH" | grep -q "/opt/go/bin"'; then
          echo "KSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Ksh integration test passed"
        else
          echo "KSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Ksh integration test FAILED"
          exit 1
        fi

    - name: Test Fish
      continue-on-error: true
      run: |
        if ! command -v fish &> /dev/null;
        then
          echo "FISH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Fish not found, skipping test."
          exit 0
        fi
        echo "=== Testing Fish ==="
        if fish -c './genv init --path test.env fish | source; test "$EDITOR" = "/usr/bin/vim"; and test "$GENV_TEST" = "integration"; and test "$TEST_VALUE" = "hello-world"; and test "$GOPATH" = "/opt/go"; and string match -q "*$GOPATH/bin*" "$PATH"'; then
          echo "FISH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Fish integration test passed"
        else
          echo "FISH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Fish integration test FAILED"
          exit 1
        fi

    - name: Test Tcsh
      continue-on-error: true
      run: |
        if ! command -v tcsh &> /dev/null;
        then
          echo "TCSH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Tcsh not found, skipping test."
          exit 0
        fi
        echo "=== Testing Tcsh ==="
        ./genv init --path test.env tcsh > test.tcsh
        if tcsh -c 'source test.tcsh && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration" && test "$TEST_VALUE" = "hello-world" && test "$GOPATH" = "/opt/go"'; then
          echo "TCSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Tcsh integration test passed"
        else
          echo "TCSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Tcsh integration test FAILED"
          exit 1
        fi

    - name: Test PowerShell
      continue-on-error: true
      run: |
        if ! command -v pwsh &> /dev/null;
        then
          echo "PWSH_STATUS=⚠️" >> $GITHUB_ENV
          echo "PowerShell not found, skipping test."
          exit 0
        fi
        echo "=== Testing PowerShell ==="
        if pwsh -Command './genv init --path test.env pwsh | Invoke-Expression; if ($env:EDITOR -ne "/usr/bin/vim") { exit 1 }; if ($env:GENV_TEST -ne "integration") { exit 1 }; if ($env:TEST_VALUE -ne "hello-world") { exit 1 }; if ($env:GOPATH -ne "/opt/go") { exit 1 }; if ($env:PATH -notmatch "/opt/go/bin") { exit 1 }'; then
          echo "PWSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ PowerShell integration test passed"
        else
          echo "PWSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ PowerShell integration test FAILED"
          exit 1
        fi

    - name: Test Nushell
      continue-on-error: true
      run: |
        if ! command -v nu &> /dev/null;
        then
          echo "NUSHELL_STATUS=⚠️" >> $GITHUB_ENV
          echo "Nushell not found, skipping test."
          exit 0
        fi
        echo "=== Testing Nushell ==="
        ./genv init --path test.env nu > test.nu
        if nu -c 'source test.nu; if $env.EDITOR != "/usr/bin/vim" { exit 1 }; if $env.GENV_TEST != "integration" { exit 1 }; if $env.TEST_VALUE != "hello-world" { exit 1 }; if $env.GOPATH != "/opt/go" { exit 1 }'; then
          echo "NUSHELL_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Nushell integration test passed"
        else
          echo "NUSHELL_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Nushell integration test FAILED"
          exit 1
        fi

    - name: Test Ion
      continue-on-error: true
      run: |
        if ! command -v ion &> /dev/null;
        then
          echo "ION_STATUS=⚠️" >> $GITHUB_ENV
          echo "Ion not found, skipping test."
          exit 0
        fi
        echo "=== Testing Ion ==="
        if ion -c 'eval "$(./genv init --path test.env ion)" && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration" && test "$TEST_VALUE" = "hello-world" && test "$GOPATH" = "/opt/go" && echo "$PATH" | grep -q "/opt/go/bin"'; then
          echo "ION_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Ion integration test passed"
        else
          echo "ION_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Ion integration test FAILED"
          exit 1
        fi

    - name: Test Rc
      continue-on-error: true
      run: |
        if ! command -v rc &> /dev/null;
        then
          echo "RC_STATUS=⚠️" >> $GITHUB_ENV
          echo "Rc not found, skipping test."
          exit 0
        fi
        echo "=== Testing Rc ==="
        ./genv init --path test.env rc > test.rc
        if rc -c '. ./test.rc && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration" && test "$TEST_VALUE" = "hello-world" && test "$GOPATH" = "/opt/go"'; then
          echo "RC_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Rc integration test passed"
        else
          echo "RC_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Rc integration test FAILED"
          exit 1
        fi

    - name: Install Elvish
      continue-on-error: true
      run: sudo apt-get install -y elvish

    - name: Test Elvish
      continue-on-error: true
      run: |
        if ! command -v elvish &> /dev/null;
        then
          echo "ELVISH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Elvish not found, skipping test."
          exit 0
        fi
        echo "=== Testing Elvish ==="
        ./genv init --path test.env elvish > test.elv
        if elvish -c 'eval (cat test.elv | slurp); test $E:EDITOR = "/usr/bin/vim"; and test $E:GENV_TEST = "integration"; and test $E:TEST_VALUE = "hello-world"; and test $E:GOPATH = "/opt/go"'; then
          echo "ELVISH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Elvish integration test passed"
        else
          echo "ELVISH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Elvish integration test FAILED"
          exit 1
        fi

    - name: Install Xonsh
      continue-on-error: true
      run: |
        sudo apt-get install -y pipx
        pipx install xonsh
        pipx ensurepath

    - name: Test Xonsh
      continue-on-error: true
      run: |
        # Add pipx bin to PATH
        export PATH="$HOME/.local/bin:$PATH"
        if ! command -v xonsh &> /dev/null;
        then
          echo "XONSH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Xonsh not found, skipping test."
          exit 0
        fi
        echo "=== Testing Xonsh ==="
        ./genv init --path test.env xonsh > test.xsh
        if xonsh -c 'source-bash test.xsh; test $EDITOR = "/usr/bin/vim" and $GENV_TEST = "integration" and $TEST_VALUE = "hello-world" and $GOPATH = "/opt/go"'; then
          echo "XONSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Xonsh integration test passed"
        else
          echo "XONSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Xonsh integration test FAILED"
          exit 1
        fi

    - name: Test Sh
      continue-on-error: true
      run: |
        if ! command -v sh &> /dev/null;
        then
          echo "SH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Sh not found, skipping test."
          exit 0
        fi
        echo "=== Testing Sh (POSIX) ==="
        if sh -c 'eval "$(./genv init --path test.env sh)" && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration" && test "$TEST_VALUE" = "hello-world" && test "$GOPATH" = "/opt/go"'; then
          echo "SH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Sh integration test passed"
        else
          echo "SH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Sh integration test FAILED"
          exit 1
        fi

    - name: Install Ash (BusyBox)
      continue-on-error: true
      run: |
        sudo apt-get install -y busybox
        sudo ln -sf /usr/bin/busybox /usr/local/bin/ash || true

    - name: Test Ash
      continue-on-error: true
      run: |
        if ! command -v ash &> /dev/null;
        then
          echo "ASH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Ash not found, skipping test."
          exit 0
        fi
        echo "=== Testing Ash ==="
        if ash -c 'eval "$(./genv init --path test.env ash)" && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration" && test "$TEST_VALUE" = "hello-world" && test "$GOPATH" = "/opt/go"'; then
          echo "ASH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Ash integration test passed"
        else
          echo "ASH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Ash integration test FAILED"
          exit 1
        fi

    - name: Generate test summary
      if: always()
      run: |
        echo "# Shell Integration Test Results (Linux)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Shell | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Bash | ${BASH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Sh | ${SH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Ash | ${ASH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Zsh | ${ZSH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Ksh | ${KSH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Fish | ${FISH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tcsh | ${TCSH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY

        echo "| PowerShell | ${PWSH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Nushell | ${NUSHELL_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Xonsh | ${XONSH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Elvish | ${ELVISH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Ion | ${ION_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Rc | ${RC_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Configuration" >> $GITHUB_STEP_SUMMARY
        echo '```toml' >> $GITHUB_STEP_SUMMARY
        cat test.env >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        FINAL_STATUS="success"
        for status in ${BASH_STATUS:-⚠️} ${ZSH_STATUS:-⚠️} ${KSH_STATUS:-⚠️} ${FISH_STATUS:-⚠️} ${TCSH_STATUS:-⚠️} ${PWSH_STATUS:-⚠️} ${NUSHELL_STATUS:-⚠️} ${ION_STATUS:-⚠️} ${RC_STATUS:-⚠️}; do
          if [[ "$status" == "❌" ]]; then
            FINAL_STATUS="failure"
            break
          fi
        done

        if [ "$FINAL_STATUS" == "failure" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Some tests failed on Linux**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
    
    - name: Set outputs
      id: set-outputs
      if: always()
      run: |
        echo "bash_status=${BASH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "zsh_status=${ZSH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "ksh_status=${KSH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "fish_status=${FISH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "tcsh_status=${TCSH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "pwsh_status=${PWSH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "nushell_status=${NUSHELL_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "ion_status=${ION_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "rc_status=${RC_STATUS:-⚠️}" >> $GITHUB_OUTPUT

  test-shells-macos:
    name: Test Shells on macOS
    runs-on: macos-latest
    outputs:
      bash_status: ${{ steps.set-outputs.outputs.bash_status }}
      zsh_status: ${{ steps.set-outputs.outputs.zsh_status }}
      fish_status: ${{ steps.set-outputs.outputs.fish_status }}
      pwsh_status: ${{ steps.set-outputs.outputs.pwsh_status }}
      nushell_status: ${{ steps.set-outputs.outputs.nushell_status }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build genv
      run: go build -o genv ./cmd/genv

    - name: Install Bash
      continue-on-error: true
      run: brew install bash

    - name: Install Zsh
      continue-on-error: true
      run: brew install zsh

    - name: Install Fish
      continue-on-error: true
      run: brew install fish

    - name: Install Nushell
      continue-on-error: true
      run: brew install nushell

    - name: Install PowerShell
      continue-on-error: true
      run: brew install powershell

    - name: Create test config
      run: |
        cat > test.env << 'EOF'
        EDITOR = "/usr/bin/vim"
        GENV_TEST = "integration-macos"
        TEST_VALUE = "hello-mac"
        GOPATH = "/opt/go"
        PATH = ["$PATH", "$GOPATH/bin", "/opt/homebrew/bin"]
        EOF

    - name: Test Bash
      continue-on-error: true
      run: |
        if ! command -v bash &> /dev/null;
        then
          echo "BASH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Bash not found, skipping test."
          exit 0
        fi
        echo "=== Testing Bash ==="
        if bash -c 'eval "$(./genv init --path test.env bash)" && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration-macos" && test "$GOPATH" = "/opt/go"'; then
          echo "BASH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Bash integration test passed"
        else
          echo "BASH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Bash integration test FAILED"
          exit 1
        fi

    - name: Test Zsh
      continue-on-error: true
      run: |
        if ! command -v zsh &> /dev/null;
        then
          echo "ZSH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Zsh not found, skipping test."
          exit 0
        fi
        echo "=== Testing Zsh ==="
        if zsh -c 'eval "$(./genv init --path test.env zsh)" && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration-macos" && test "$GOPATH" = "/opt/go"'; then
          echo "ZSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Zsh integration test passed"
        else
          echo "ZSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Zsh integration test FAILED"
          exit 1
        fi

    - name: Test Fish
      continue-on-error: true
      run: |
        if ! command -v fish &> /dev/null;
        then
          echo "FISH_STATUS=⚠️" >> $GITHUB_ENV
          echo "Fish not found, skipping test."
          exit 0
        fi
        echo "=== Testing Fish ==="
        if fish -c './genv init --path test.env fish | source; test "$EDITOR" = "/usr/bin/vim"; and test "$GENV_TEST" = "integration-macos"; and test "$GOPATH" = "/opt/go"'; then
          echo "FISH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Fish integration test passed"
        else
          echo "FISH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Fish integration test FAILED"
          exit 1
        fi

    - name: Test PowerShell
      continue-on-error: true
      run: |
        if ! command -v pwsh &> /dev/null;
        then
          echo "PWSH_STATUS=⚠️" >> $GITHUB_ENV
          echo "PowerShell not found, skipping test."
          exit 0
        fi
        echo "=== Testing PowerShell ==="
        if pwsh -Command './genv init --path test.env pwsh | Invoke-Expression; if ($env:EDITOR -ne "/usr/bin/vim") { exit 1 }; if ($env:GENV_TEST -ne "integration-macos") { exit 1 }; if ($env:GOPATH -ne "/opt/go") { exit 1 }; if ($env:PATH -notmatch ":") { exit 1 }'; then
          echo "PWSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ PowerShell integration test passed (colon delimiter verified)"
        else
          echo "PWSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ PowerShell integration test FAILED"
          exit 1
        fi

    - name: Test Nushell
      continue-on-error: true
      run: |
        if ! command -v nu &> /dev/null;
        then
          echo "NUSHELL_STATUS=⚠️" >> $GITHUB_ENV
          echo "Nushell not found, skipping test."
          exit 0
        fi
        echo "=== Testing Nushell ==="
        ./genv init --path test.env nu > test.nu
        if nu -c 'source test.nu; if $env.EDITOR != "/usr/bin/vim" { exit 1 }; if $env.GENV_TEST != "integration-macos" { exit 1 }; if $env.GOPATH != "/opt/go" { exit 1 }'; then
          echo "NUSHELL_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Nushell integration test passed"
        else
          echo "NUSHELL_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Nushell integration test FAILED"
          exit 1
        fi

    - name: Generate test summary
      if: always()
      run: |
        echo "# Shell Integration Test Results (macOS)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Shell | Status | Notes |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Bash | ${BASH_STATUS:-⚠️} | Default shell |" >> $GITHUB_STEP_SUMMARY
        echo "| Zsh | ${ZSH_STATUS:-⚠️} | Default shell (newer macOS) |" >> $GITHUB_STEP_SUMMARY
        echo "| Fish | ${FISH_STATUS:-⚠️} | Via Homebrew |" >> $GITHUB_STEP_SUMMARY
        echo "| PowerShell | ${PWSH_STATUS:-⚠️} | Colon delimiter verified |" >> $GITHUB_STEP_SUMMARY
        echo "| Nushell | ${NUSHELL_STATUS:-⚠️} | Via Homebrew |" >> $GITHUB_STEP_SUMMARY
        
        FINAL_STATUS="success"
        for status in ${BASH_STATUS:-⚠️} ${ZSH_STATUS:-⚠️} ${FISH_STATUS:-⚠️} ${PWSH_STATUS:-⚠️} ${NUSHELL_STATUS:-⚠️}; do
          if [[ "$status" == "❌" ]]; then
            FINAL_STATUS="failure"
            break
          fi
        done

        if [ "$FINAL_STATUS" == "failure" ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Some tests failed on macOS**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
    
    - name: Set outputs
      id: set-outputs
      if: always()
      run: |
        echo "bash_status=${BASH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "zsh_status=${ZSH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "fish_status=${FISH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "pwsh_status=${PWSH_STATUS:-⚠️}" >> $GITHUB_OUTPUT
        echo "nushell_status=${NUSHELL_STATUS:-⚠️}" >> $GITHUB_OUTPUT

  test-shells-windows:
    name: Test Shells on Windows
    runs-on: windows-latest
    outputs:
      pwsh_status: ${{ steps.set-outputs.outputs.pwsh_status }}
      cmd_status: ${{ steps.set-outputs.outputs.cmd_status }}
      clink_status: ${{ steps.set-outputs.outputs.clink_status }}
      nushell_status: ${{ steps.set-outputs.outputs.nushell_status }}
      xonsh_status: ${{ steps.set-outputs.outputs.xonsh_status }}
      elvish_status: ${{ steps.set-outputs.outputs.elvish_status }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build genv
      run: go build -o genv.exe ./cmd/genv

    - name: Create test config
      run: |
        @"
        EDITOR = "C:\\Program Files\\Vim\\vim.exe"
        GENV_TEST = "integration-windows"
        TEST_VALUE = "hello-windows"
        GOPATH = "C:\\Go"
        PATH = ["`$PATH", "`$GOPATH\\bin", "C:\\tools"]
        "@ | Out-File -FilePath test.env -Encoding utf8

    - name: Test PowerShell
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "=== Testing PowerShell ==="
        try {
          $output = .\genv.exe init --path test.env pwsh
          if ([string]::IsNullOrWhiteSpace($output)) { throw "genv produced empty output" }
          Invoke-Expression $output
          if ($env:EDITOR -ne "C:\Program Files\Vim\vim.exe") { throw "EDITOR mismatch: ${env:EDITOR}" }
          if ($env:GENV_TEST -ne "integration-windows") { throw "GENV_TEST mismatch: ${env:GENV_TEST}" }
          if ($env:GOPATH -ne "C:\Go") { throw "GOPATH mismatch: ${env:GOPATH}" }
          if ($env:PATH -notmatch ";") { throw "PATH should use semicolon on Windows" }
          if ($env:PATH -notmatch "C:\\Go\\bin") { throw "PATH should contain GOPATH\bin" }
          Write-Host "✓ PowerShell integration test passed (semicolon delimiter verified)"
          "PWSH_STATUS=✅" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          Write-Host "✗ PowerShell integration test FAILED: $_ "
          "PWSH_STATUS=❌" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Test CMD
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "`n=== Testing CMD ==="
        try {
          .\genv.exe init --path test.env cmd > test.bat
          cmd /c "call test.bat && if not `"%EDITOR%`"==`"C:\\Program Files\\Vim\\vim.exe`" (exit /b 1) && if not `"%GENV_TEST%`"==`"integration-windows`" (exit /b 1) && if not `"%GOPATH%`"==`"C:\\Go`" (exit /b 1)"
          if ($LASTEXITCODE -ne 0) { throw "CMD test failed with exit code $LASTEXITCODE" }
          Write-Host "✓ CMD integration test passed"
          "CMD_STATUS=✅" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          Write-Host "✗ CMD integration test FAILED: $_ "
          "CMD_STATUS=❌" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Install Clink
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "=== Installing Clink ==="
        choco install clink -y

    - name: Test Clink
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "`n=== Testing Clink ==="
        try {
          .\genv.exe init --path test.env clink > test_clink.lua
          # Create a test script that loads clink config
          @'
          @echo off
          clink inject --profile . --quiet
          call test.bat
          if not "%EDITOR%"=="C:\\Program Files\\Vim\\vim.exe" (exit /b 1)
          if not "%GENV_TEST%"=="integration-windows" (exit /b 1)
          if not "%GOPATH%"=="C:\\Go" (exit /b 1)
          '@ | Out-File -FilePath test_clink.bat -Encoding ascii
          
          # Copy lua file to clink profile
          New-Item -ItemType Directory -Force -Path ".clink" | Out-Null
          Copy-Item test_clink.lua .clink/genv.lua
          
          # Test with clink
          $env:CLINK_PROFILE = "."
          cmd /c test_clink.bat
          if ($LASTEXITCODE -ne 0) { throw "Clink test failed with exit code $LASTEXITCODE" }
          Write-Host "✓ Clink integration test passed"
          "CLINK_STATUS=✅" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          Write-Host "✗ Clink integration test FAILED: $_ "
          "CLINK_STATUS=❌" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Install Nushell
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "=== Installing Nushell ==="
        winget install nushell.nushell --accept-source-agreements --accept-package-agreements

    - name: Test Nushell
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "`n=== Testing Nushell ==="
        try {
          # Add nushell to PATH
          $env:PATH = "${env:LOCALAPPDATA}\Microsoft\WinGet\Packages\Nushell.Nushell_Microsoft.Winget.Source_8wekyb3d8bbwe;${env:PATH}"
          
          if (-not (Get-Command nu -ErrorAction SilentlyContinue)) {
            Write-Host "Nushell not found, skipping test"
            "NUSHELL_STATUS=⚠️" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            return
          }
          
          .\genv.exe init --path test.env nushell | Out-File -FilePath test.nu -Encoding utf8
          @"
          source test.nu
          if `$env.EDITOR != "C:\\Program Files\\Vim\\vim.exe" { exit 1 }
          if `$env.GENV_TEST != "integration-windows" { exit 1 }
          if `$env.GOPATH != "C:\\Go" { exit 1 }
          if (`$env.PATH | str contains "C:\\Go\\bin" | not) { exit 1 }
          "@ | Out-File -FilePath test_nu.nu -Encoding utf8
          nu test_nu.nu
          if ($LASTEXITCODE -ne 0) { throw "Nushell test failed" }
          Write-Host "✓ Nushell integration test passed"
          "NUSHELL_STATUS=✅" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          Write-Host "✗ Nushell integration test FAILED: $_ "
          "NUSHELL_STATUS=❌" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Install Xonsh
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "=== Installing Xonsh ==="
        pip install xonsh

    - name: Test Xonsh
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "`n=== Testing Xonsh ==="
        try {
          if (-not (Get-Command xonsh -ErrorAction SilentlyContinue)) {
            Write-Host "Xonsh not found, skipping test"
            "XONSH_STATUS=⚠️" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            return
          }
          
          .\genv.exe init --path test.env xonsh > test.xsh
          # Xonsh test - source-bash might not work on Windows, so we'll test basic functionality
          xonsh -c "execx(`$(cat test.xsh).strip()); assert `$EDITOR == 'C:\\Program Files\\Vim\\vim.exe'; assert `$GENV_TEST == 'integration-windows'; assert `$GOPATH == 'C:\\Go'"
          if ($LASTEXITCODE -ne 0) { throw "Xonsh test failed" }
          Write-Host "✓ Xonsh integration test passed"
          "XONSH_STATUS=✅" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          Write-Host "✗ Xonsh integration test FAILED: $_ "
          "XONSH_STATUS=❌" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Install Elvish
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "=== Installing Elvish ==="
        # Download Elvish for Windows
        $elvishUrl = "https://dl.elv.sh/windows-amd64/elvish-HEAD.zip"
        Invoke-WebRequest -Uri $elvishUrl -OutFile elvish.zip
        Expand-Archive -Path elvish.zip -DestinationPath elvish_temp
        Move-Item -Path elvish_temp\elvish-HEAD.exe -Destination C:\Windows\System32\elvish.exe -Force
        Remove-Item -Recurse -Force elvish_temp, elvish.zip

    - name: Test Elvish
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "`n=== Testing Elvish ==="
        try {
          if (-not (Get-Command elvish -ErrorAction SilentlyContinue)) {
            Write-Host "Elvish not found, skipping test"
            "ELVISH_STATUS=⚠️" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            return
          }
          
          .\genv.exe init --path test.env elvish | Out-File -FilePath test.elv -Encoding utf8
          # Test Elvish with semicolon delimiter on Windows
          @"
          eval (cat test.elv | slurp)
          if (!=s `$E:EDITOR "C:\\Program Files\\Vim\\vim.exe") { exit 1 }
          if (!=s `$E:GENV_TEST "integration-windows") { exit 1 }
          if (!=s `$E:GOPATH "C:\\Go") { exit 1 }
          "@ | Out-File -FilePath test_elv.elv -Encoding utf8
          elvish test_elv.elv
          if ($LASTEXITCODE -ne 0) { throw "Elvish test failed" }
          Write-Host "✓ Elvish integration test passed (semicolon delimiter verified)"
          "ELVISH_STATUS=✅" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          Write-Host "✗ Elvish integration test FAILED: $_ "
          "ELVISH_STATUS=❌" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 1
        }

    - name: Generate test summary
      if: always()
      shell: pwsh
      run: |
        $pwshStatus = if ($env:PWSH_STATUS) { $env:PWSH_STATUS } else { "⚠️" }
        $cmdStatus = if ($env:CMD_STATUS) { $env:CMD_STATUS } else { "⚠️" }
        $clinkStatus = if ($env:CLINK_STATUS) { $env:CLINK_STATUS } else { "⚠️" }
        $nushellStatus = if ($env:NUSHELL_STATUS) { $env:NUSHELL_STATUS } else { "⚠️" }
        $xonshStatus = if ($env:XONSH_STATUS) { $env:XONSH_STATUS } else { "⚠️" }
        $elvishStatus = if ($env:ELVISH_STATUS) { $env:ELVISH_STATUS } else { "⚠️" }
        
        @"
        # Shell Integration Test Results (Windows)
        
        | Shell | Status | Notes |
        |-------|--------|-------|
        | PowerShell | $pwshStatus | Semicolon delimiter verified |
        | CMD | $cmdStatus | Batch file syntax |
        | Clink | $clinkStatus | CMD with Lua scripting |
        | Nushell | $nushellStatus | Modern shell with native arrays |
        | Xonsh | $xonshStatus | Python-based shell |
        | Elvish | $elvishStatus | Semicolon delimiter on Windows |
        
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        
        if (($env:PWSH_STATUS -eq "❌") -or ($env:CMD_STATUS -eq "❌") -or ($env:CLINK_STATUS -eq "❌") -or ($env:NUSHELL_STATUS -eq "❌") -or ($env:XONSH_STATUS -eq "❌") -or ($env:ELVISH_STATUS -eq "❌")) {
          "`n❌ **Some tests failed on Windows**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit 1
        }
    
    - name: Set outputs
      id: set-outputs
      if: always()
      shell: pwsh
      run: |
        $pwshStatus = if ($env:PWSH_STATUS) { $env:PWSH_STATUS } else { "⚠️" }
        $cmdStatus = if ($env:CMD_STATUS) { $env:CMD_STATUS } else { "⚠️" }
        $clinkStatus = if ($env:CLINK_STATUS) { $env:CLINK_STATUS } else { "⚠️" }
        $nushellStatus = if ($env:NUSHELL_STATUS) { $env:NUSHELL_STATUS } else { "⚠️" }
        $xonshStatus = if ($env:XONSH_STATUS) { $env:XONSH_STATUS } else { "⚠️" }
        $elvishStatus = if ($env:ELVISH_STATUS) { $env:ELVISH_STATUS } else { "⚠️" }
        "pwsh_status=$pwshStatus" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "cmd_status=$cmdStatus" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "clink_status=$clinkStatus" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "nushell_status=$nushellStatus" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "xonsh_status=$xonshStatus" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "elvish_status=$elvishStatus" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  syntax-verification:
    name: Verify Shell Syntax
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build genv
      run: go build -o genv ./cmd/genv

    - name: Install dependencies
      run: sudo apt-get update

    - name: Install shellcheck
      continue-on-error: true
      run: sudo apt-get install -y shellcheck

    - name: Install bash
      continue-on-error: true
      run: sudo apt-get install -y bash

    - name: Install zsh
      continue-on-error: true
      run: sudo apt-get install -y zsh

    - name: Install fish
      continue-on-error: true
      run: sudo apt-get install -y fish

    - name: Create test config
      run: |
        cat > test.env << 'EOF'
        EDITOR = "/usr/bin/vim"
        TEST = "syntax-check"
        PATH = ["$PATH", "/usr/local/bin"]
        EOF

    - name: Verify Bash syntax
      continue-on-error: true
      run: |
        if ! command -v bash &> /dev/null || ! command -v shellcheck &> /dev/null;
        then
          echo "BASH_SYNTAX=⚠️" >> $GITHUB_ENV
          echo "Bash or shellcheck not found, skipping test."
          exit 0
        fi
        ./genv init --path test.env bash > test.bash
        if bash -n test.bash && shellcheck -s bash test.bash;
        then
          echo "BASH_SYNTAX=✅" >> $GITHUB_ENV
          echo "✓ Bash syntax valid"
        else
          echo "BASH_SYNTAX=❌" >> $GITHUB_ENV
          echo "✗ Bash syntax check FAILED"
          exit 1
        fi
        
    - name: Verify Zsh syntax
      continue-on-error: true
      run: |
        if ! command -v zsh &> /dev/null;
        then
          echo "ZSH_SYNTAX=⚠️" >> $GITHUB_ENV
          echo "Zsh not found, skipping test."
          exit 0
        fi
        ./genv init --path test.env zsh > test.zsh
        if zsh -n test.zsh;
        then
          echo "ZSH_SYNTAX=✅" >> $GITHUB_ENV
          echo "✓ Zsh syntax valid"
        else
          echo "ZSH_SYNTAX=❌" >> $GITHUB_ENV
          echo "✗ Zsh syntax check FAILED"
          exit 1
        fi
        
    - name: Verify Fish syntax
      continue-on-error: true
      run: |
        if ! command -v fish &> /dev/null;
        then
          echo "FISH_SYNTAX=⚠️" >> $GITHUB_ENV
          echo "Fish not found, skipping test."
          exit 0
        fi
        ./genv init --path test.env fish > test.fish
        if fish -n test.fish;
        then
          echo "FISH_SYNTAX=✅" >> $GITHUB_ENV
          echo "✓ Fish syntax valid"
        else
          echo "FISH_SYNTAX=❌" >> $GITHUB_ENV
          echo "✗ Fish syntax check FAILED"
          exit 1
        fi
        
    - name: Verify PowerShell syntax
      continue-on-error: true
      run: |
        ./genv init --path test.env pwsh > test.ps1
        if grep -q '\$env:' test.ps1;
        then
          echo "PWSH_SYNTAX=✅" >> $GITHUB_ENV
          echo "✓ PowerShell syntax patterns found"
        else
          echo "PWSH_SYNTAX=❌" >> $GITHUB_ENV
          echo "✗ PowerShell syntax check FAILED"
          exit 1
        fi

    - name: Generate syntax summary
      if: always()
      run: |
        echo "# Shell Syntax Verification" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Shell | Syntax Check | Linter |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Bash | ${BASH_SYNTAX:-⚠️} bash -n | shellcheck |" >> $GITHUB_STEP_SUMMARY
        echo "| Zsh | ${ZSH_SYNTAX:-⚠️} zsh -n | - |" >> $GITHUB_STEP_SUMMARY
        echo "| Fish | ${FISH_SYNTAX:-⚠️} fish -n | - |" >> $GITHUB_STEP_SUMMARY
        echo "| PowerShell | ${PWSH_SYNTAX:-⚠️} Pattern check | - |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        FINAL_STATUS="success"
        for status in ${BASH_SYNTAX:-⚠️} ${ZSH_SYNTAX:-⚠️} ${FISH_SYNTAX:-⚠️} ${PWSH_SYNTAX:-⚠️}; do
          if [[ "$status" == "❌" ]]; then
            FINAL_STATUS="failure"
            break
          fi
        done

        if [ "$FINAL_STATUS" == "success" ]; then
          echo "✅ All generated scripts have valid syntax!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Some syntax checks failed**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs: [test-shells-linux, test-shells-macos, test-shells-windows, syntax-verification]
    if: always()
    
    steps:
    - name: Generate overall summary
      run: |
        echo "# 🧪 Shell Integration Testing Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Results by Platform" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Status | Shells Tested |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|---------------|" >> $GITHUB_STEP_SUMMARY
        echo "| Linux | ${{ needs.test-shells-linux.result == 'success' && '✅' || '❌' }} | Bash, Zsh, Ksh, Fish, Tcsh, PowerShell, Nushell, Ion, Rc |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS | ${{ needs.test-shells-macos.result == 'success' && '✅' || '❌' }} | Bash, Zsh, Fish, PowerShell, Nushell |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows | ${{ needs.test-shells-windows.result == 'success' && '✅' || '❌' }} | PowerShell, CMD |" >> $GITHUB_STEP_SUMMARY
        echo "| Syntax | ${{ needs.syntax-verification.result == 'success' && '✅' || '❌' }} | Bash, Zsh, Fish, PowerShell |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Show detailed shell status if any platform failed
        if [ "${{ needs.test-shells-linux.result }}" != "success" ] || [ "${{ needs.test-shells-macos.result }}" != "success" ] || [ "${{ needs.test-shells-windows.result }}" != "success" ]; then
          echo "## Detailed Shell Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.test-shells-linux.result }}" != "success" ]; then
            echo "### Linux" >> $GITHUB_STEP_SUMMARY
            echo "| Shell | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Bash | ${{ needs.test-shells-linux.outputs.bash_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Zsh | ${{ needs.test-shells-linux.outputs.zsh_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Ksh | ${{ needs.test-shells-linux.outputs.ksh_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Fish | ${{ needs.test-shells-linux.outputs.fish_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tcsh | ${{ needs.test-shells-linux.outputs.tcsh_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| PowerShell | ${{ needs.test-shells-linux.outputs.pwsh_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Nushell | ${{ needs.test-shells-linux.outputs.nushell_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Ion | ${{ needs.test-shells-linux.outputs.ion_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Rc | ${{ needs.test-shells-linux.outputs.rc_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test-shells-macos.result }}" != "success" ]; then
            echo "### macOS" >> $GITHUB_STEP_SUMMARY
            echo "| Shell | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Bash | ${{ needs.test-shells-macos.outputs.bash_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Zsh | ${{ needs.test-shells-macos.outputs.zsh_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Fish | ${{ needs.test-shells-macos.outputs.fish_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| PowerShell | ${{ needs.test-shells-macos.outputs.pwsh_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Nushell | ${{ needs.test-shells-macos.outputs.nushell_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test-shells-windows.result }}" != "success" ]; then
            echo "### Windows" >> $GITHUB_STEP_SUMMARY
            echo "| Shell | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| PowerShell | ${{ needs.test-shells-windows.outputs.pwsh_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "| CMD | ${{ needs.test-shells-windows.outputs.cmd_status }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
        fi
        
