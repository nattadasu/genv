name: Shell Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-shells-linux:
    name: Test Shells on Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build genv
      run: go build -o genv ./cmd/genv

    - name: Install shells
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bash \
          zsh \
          ksh \
          tcsh \
          fish \
          powershell

    - name: Install Nushell
      run: |
        wget https://github.com/nushell/nushell/releases/download/0.88.0/nu-0.88.0-x86_64-unknown-linux-gnu.tar.gz
        tar xzf nu-0.88.0-x86_64-unknown-linux-gnu.tar.gz
        sudo mv nu-0.88.0-x86_64-unknown-linux-gnu/nu /usr/local/bin/
        nu --version

    - name: Install Ion shell
      run: |
        git clone https://gitlab.redox-os.org/redox-os/ion/
        cd ion
        cargo build --release
        sudo cp target/release/ion /usr/local/bin/
        ion --version

    - name: Create test config
      run: |
        cat > test.env << 'EOF'
        EDITOR = "/usr/bin/vim"
        GENV_TEST = "integration"
        TEST_VALUE = "hello-world"
        GOPATH = "/opt/go"
        PATH = ["$PATH", "$GOPATH/bin", "/opt/bin"]
        EOF

    - name: Run all shell tests
      continue-on-error: true
      run: |
        FAILED=0
        
        echo "=== Testing Bash ==="
        if bash -c 'eval "$(./genv init --path test.env bash)" && \
          test "$EDITOR" = "/usr/bin/vim" && \
          test "$GENV_TEST" = "integration" && \
          test "$TEST_VALUE" = "hello-world" && \
          test "$GOPATH" = "/opt/go" && \
          echo "$PATH" | grep -q "/opt/go/bin"'; then
          echo "BASH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Bash integration test passed"
        else
          echo "BASH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Bash integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing Zsh ==="
        if zsh -c 'eval "$(./genv init --path test.env zsh)" && \
          test "$EDITOR" = "/usr/bin/vim" && \
          test "$GENV_TEST" = "integration" && \
          test "$TEST_VALUE" = "hello-world" && \
          test "$GOPATH" = "/opt/go" && \
          echo "$PATH" | grep -q "/opt/go/bin"'; then
          echo "ZSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Zsh integration test passed"
        else
          echo "ZSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Zsh integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing Ksh ==="
        if ksh -c 'eval "$(./genv init --path test.env ksh)" && \
          test "$EDITOR" = "/usr/bin/vim" && \
          test "$GENV_TEST" = "integration" && \
          test "$TEST_VALUE" = "hello-world" && \
          test "$GOPATH" = "/opt/go" && \
          echo "$PATH" | grep -q "/opt/go/bin"'; then
          echo "KSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Ksh integration test passed"
        else
          echo "KSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Ksh integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing Fish ==="
        if fish -c './genv init --path test.env fish | source; \
          test "$EDITOR" = "/usr/bin/vim"; and \
          test "$GENV_TEST" = "integration"; and \
          test "$TEST_VALUE" = "hello-world"; and \
          test "$GOPATH" = "/opt/go"; and \
          string match -q "*$GOPATH/bin*" "$PATH"'; then
          echo "FISH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Fish integration test passed"
        else
          echo "FISH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Fish integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing Tcsh ==="
        if tcsh -c 'eval "`./genv init --path test.env tcsh`" && \
          test "$EDITOR" = "/usr/bin/vim" && \
          test "$GENV_TEST" = "integration" && \
          test "$TEST_VALUE" = "hello-world" && \
          test "$GOPATH" = "/opt/go"'; then
          echo "TCSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Tcsh integration test passed"
        else
          echo "TCSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Tcsh integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing PowerShell ==="
        if pwsh -Command './genv init --path test.env pwsh | Invoke-Expression; if ($env:EDITOR -ne "/usr/bin/vim") { exit 1 }; if ($env:GENV_TEST -ne "integration") { exit 1 }; if ($env:TEST_VALUE -ne "hello-world") { exit 1 }; if ($env:GOPATH -ne "/opt/go") { exit 1 }; if ($env:PATH -notmatch "/opt/go/bin") { exit 1 }'; then
          echo "PWSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ PowerShell integration test passed"
        else
          echo "PWSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ PowerShell integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing Nushell ==="
        ./genv init --path test.env nu > test.nu
        if nu -c 'source test.nu; if $env.EDITOR != "/usr/bin/vim" { exit 1 }; if $env.GENV_TEST != "integration" { exit 1 }; if $env.TEST_VALUE != "hello-world" { exit 1 }; if $env.GOPATH != "/opt/go" { exit 1 }'; then
          echo "NUSHELL_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Nushell integration test passed"
        else
          echo "NUSHELL_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Nushell integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing Ion ==="
        if ion -c 'eval "$(./genv init --path test.env ion)" && test "$EDITOR" = "/usr/bin/vim" && test "$GENV_TEST" = "integration" && test "$TEST_VALUE" = "hello-world" && test "$GOPATH" = "/opt/go" && echo "$PATH" | grep -q "/opt/go/bin"'; then
          echo "ION_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Ion integration test passed"
        else
          echo "ION_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Ion integration test FAILED"
          FAILED=1
        fi
        
        echo "LINUX_FAILED=$FAILED" >> $GITHUB_ENV
        exit $FAILED

    - name: Generate test summary
      if: always()
      run: |
        echo "# Shell Integration Test Results (Linux)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Shell | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Bash | ${BASH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Zsh | ${ZSH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Ksh | ${KSH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Fish | ${FISH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Tcsh | ${TCSH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| PowerShell | ${PWSH_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Nushell | ${NUSHELL_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "| Ion | ${ION_STATUS:-⚠️} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Configuration" >> $GITHUB_STEP_SUMMARY
        echo '```toml' >> $GITHUB_STEP_SUMMARY
        cat test.env >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        
        if [ "${LINUX_FAILED:-0}" -ne 0 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Some tests failed on Linux**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  test-shells-macos:
    name: Test Shells on macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build genv
      run: go build -o genv ./cmd/genv

    - name: Install shells
      run: |
        brew install bash zsh fish nushell powershell

    - name: Create test config
      run: |
        cat > test.env << 'EOF'
        EDITOR = "/usr/bin/vim"
        GENV_TEST = "integration-macos"
        TEST_VALUE = "hello-mac"
        GOPATH = "/opt/go"
        PATH = ["$PATH", "$GOPATH/bin", "/opt/homebrew/bin"]
        EOF

    - name: Run all shell tests
      continue-on-error: true
      run: |
        FAILED=0
        
        echo "=== Testing Bash ==="
        if bash -c 'eval "$(./genv init --path test.env bash)" && \
          test "$EDITOR" = "/usr/bin/vim" && \
          test "$GENV_TEST" = "integration-macos" && \
          test "$GOPATH" = "/opt/go"'; then
          echo "BASH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Bash integration test passed"
        else
          echo "BASH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Bash integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing Zsh ==="
        if zsh -c 'eval "$(./genv init --path test.env zsh)" && \
          test "$EDITOR" = "/usr/bin/vim" && \
          test "$GENV_TEST" = "integration-macos" && \
          test "$GOPATH" = "/opt/go"'; then
          echo "ZSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Zsh integration test passed"
        else
          echo "ZSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Zsh integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing Fish ==="
        if fish -c './genv init --path test.env fish | source; \
          test "$EDITOR" = "/usr/bin/vim"; and \
          test "$GENV_TEST" = "integration-macos"; and \
          test "$GOPATH" = "/opt/go"'; then
          echo "FISH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Fish integration test passed"
        else
          echo "FISH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Fish integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing PowerShell ==="
        if pwsh -Command './genv init --path test.env pwsh | Invoke-Expression; if ($env:EDITOR -ne "/usr/bin/vim") { exit 1 }; if ($env:GENV_TEST -ne "integration-macos") { exit 1 }; if ($env:GOPATH -ne "/opt/go") { exit 1 }; if ($env:PATH -notmatch ":") { exit 1 }'; then
          echo "PWSH_STATUS=✅" >> $GITHUB_ENV
          echo "✓ PowerShell integration test passed (colon delimiter verified)"
        else
          echo "PWSH_STATUS=❌" >> $GITHUB_ENV
          echo "✗ PowerShell integration test FAILED"
          FAILED=1
        fi
        
        echo "=== Testing Nushell ==="
        ./genv init --path test.env nu > test.nu
        if nu -c 'source test.nu; if $env.EDITOR != "/usr/bin/vim" { exit 1 }; if $env.GENV_TEST != "integration-macos" { exit 1 }; if $env.GOPATH != "/opt/go" { exit 1 }'; then
          echo "NUSHELL_STATUS=✅" >> $GITHUB_ENV
          echo "✓ Nushell integration test passed"
        else
          echo "NUSHELL_STATUS=❌" >> $GITHUB_ENV
          echo "✗ Nushell integration test FAILED"
          FAILED=1
        fi
        
        echo "MACOS_FAILED=$FAILED" >> $GITHUB_ENV
        exit $FAILED

    - name: Generate test summary
      if: always()
      run: |
        echo "# Shell Integration Test Results (macOS)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Shell | Status | Notes |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Bash | ${BASH_STATUS:-⚠️} | Default shell |" >> $GITHUB_STEP_SUMMARY
        echo "| Zsh | ${ZSH_STATUS:-⚠️} | Default shell (newer macOS) |" >> $GITHUB_STEP_SUMMARY
        echo "| Fish | ${FISH_STATUS:-⚠️} | Via Homebrew |" >> $GITHUB_STEP_SUMMARY
        echo "| PowerShell | ${PWSH_STATUS:-⚠️} | Colon delimiter verified |" >> $GITHUB_STEP_SUMMARY
        echo "| Nushell | ${NUSHELL_STATUS:-⚠️} | Via Homebrew |" >> $GITHUB_STEP_SUMMARY
        
        if [ "${MACOS_FAILED:-0}" -ne 0 ]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "❌ **Some tests failed on macOS**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  test-shells-windows:
    name: Test Shells on Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build genv
      run: go build -o genv.exe ./cmd/genv

    - name: Create test config
      run: |
        @"
        EDITOR = "C:\\Program Files\\Vim\\vim.exe"
        GENV_TEST = "integration-windows"
        TEST_VALUE = "hello-windows"
        GOPATH = "C:\\Go"
        PATH = ["`$PATH", "`$GOPATH\\bin", "C:\\tools"]
        "@ | Out-File -FilePath test.env -Encoding utf8

    - name: Run all shell tests
      shell: pwsh
      continue-on-error: true
      run: |
        $Failed = 0
        
        Write-Host "=== Testing PowerShell ==="
        try {
          .\genv.exe init --path test.env pwsh | Invoke-Expression
          if ($env:EDITOR -ne "C:\Program Files\Vim\vim.exe") { throw "EDITOR mismatch" }
          if ($env:GENV_TEST -ne "integration-windows") { throw "GENV_TEST mismatch" }
          if ($env:GOPATH -ne "C:\Go") { throw "GOPATH mismatch" }
          if ($env:PATH -notmatch ";") { throw "PATH should use semicolon on Windows" }
          if ($env:PATH -notmatch "C:\\Go\\bin") { throw "PATH should contain GOPATH\bin" }
          Write-Host "✓ PowerShell integration test passed (semicolon delimiter verified)"
          "PWSH_STATUS=✅" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          Write-Host "✗ PowerShell integration test FAILED: $_"
          "PWSH_STATUS=❌" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $Failed = 1
        }
        
        Write-Host "`n=== Testing CMD ==="
        try {
          .\genv.exe init --path test.env cmd > test.bat
          cmd /c "call test.bat && if not `"%EDITOR%`"==`"C:\Program Files\Vim\vim.exe`" exit /b 1 && if not `"%GENV_TEST%`"==`"integration-windows`" exit /b 1 && if not `"%GOPATH%`"==`"C:\Go`" exit /b 1"
          if ($LASTEXITCODE -ne 0) { throw "CMD test failed" }
          Write-Host "✓ CMD integration test passed"
          "CMD_STATUS=✅" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          Write-Host "✗ CMD integration test FAILED: $_"
          "CMD_STATUS=❌" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $Failed = 1
        }
        
        "WINDOWS_FAILED=$Failed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        exit $Failed

    - name: Generate test summary
      if: always()
      shell: pwsh
      run: |
        $pwshStatus = if ($env:PWSH_STATUS) { $env:PWSH_STATUS } else { "⚠️" }
        $cmdStatus = if ($env:CMD_STATUS) { $env:CMD_STATUS } else { "⚠️" }
        
        @"
        # Shell Integration Test Results (Windows)
        
        | Shell | Status | Notes |
        |-------|--------|-------|
        | PowerShell | $pwshStatus | Semicolon delimiter verified |
        | CMD | $cmdStatus | Batch file syntax |
        
        ## PowerShell OS-Aware Delimiter Test
        - Semicolon (;) used on Windows
        - PATH expansion working
        - Variable references correct
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        
        if ($env:WINDOWS_FAILED -ne "0") {
          "`n❌ **Some tests failed on Windows**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit 1
        }

  syntax-verification:
    name: Verify Shell Syntax
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build genv
      run: go build -o genv ./cmd/genv

    - name: Install shell syntax checkers
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck bash zsh fish

    - name: Create test config
      run: |
        cat > test.env << 'EOF'
        EDITOR = "/usr/bin/vim"
        TEST = "syntax-check"
        PATH = ["$PATH", "/usr/local/bin"]
        EOF

    - name: Run syntax validation
      continue-on-error: true
      run: |
        FAILED=0
        
        echo "=== Verifying Bash syntax ==="
        ./genv init --path test.env bash > test.bash
        if bash -n test.bash && shellcheck -s bash test.bash; then
          echo "BASH_SYNTAX=✅" >> $GITHUB_ENV
          echo "✓ Bash syntax valid"
        else
          echo "BASH_SYNTAX=❌" >> $GITHUB_ENV
          echo "✗ Bash syntax check FAILED"
          FAILED=1
        fi
        
        echo "=== Verifying Zsh syntax ==="
        ./genv init --path test.env zsh > test.zsh
        if zsh -n test.zsh; then
          echo "ZSH_SYNTAX=✅" >> $GITHUB_ENV
          echo "✓ Zsh syntax valid"
        else
          echo "ZSH_SYNTAX=❌" >> $GITHUB_ENV
          echo "✗ Zsh syntax check FAILED"
          FAILED=1
        fi
        
        echo "=== Verifying Fish syntax ==="
        ./genv init --path test.env fish > test.fish
        if fish -n test.fish; then
          echo "FISH_SYNTAX=✅" >> $GITHUB_ENV
          echo "✓ Fish syntax valid"
        else
          echo "FISH_SYNTAX=❌" >> $GITHUB_ENV
          echo "✗ Fish syntax check FAILED"
          FAILED=1
        fi
        
        echo "=== Verifying PowerShell syntax ==="
        ./genv init --path test.env pwsh > test.ps1
        if grep -q '\$env:' test.ps1; then
          echo "PWSH_SYNTAX=✅" >> $GITHUB_ENV
          echo "✓ PowerShell syntax patterns found"
        else
          echo "PWSH_SYNTAX=❌" >> $GITHUB_ENV
          echo "✗ PowerShell syntax check FAILED"
          FAILED=1
        fi
        
        echo "SYNTAX_FAILED=$FAILED" >> $GITHUB_ENV
        exit $FAILED

    - name: Generate syntax summary
      if: always()
      run: |
        echo "# Shell Syntax Verification" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Shell | Syntax Check | Linter |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Bash | ${BASH_SYNTAX:-⚠️} bash -n | shellcheck |" >> $GITHUB_STEP_SUMMARY
        echo "| Zsh | ${ZSH_SYNTAX:-⚠️} zsh -n | - |" >> $GITHUB_STEP_SUMMARY
        echo "| Fish | ${FISH_SYNTAX:-⚠️} fish -n | - |" >> $GITHUB_STEP_SUMMARY
        echo "| PowerShell | ${PWSH_SYNTAX:-⚠️} Pattern check | - |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${SYNTAX_FAILED:-0}" -eq 0 ]; then
          echo "✅ All generated scripts have valid syntax!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Some syntax checks failed**" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs: [test-shells-linux, test-shells-macos, test-shells-windows, syntax-verification]
    if: always()
    
    steps:
    - name: Generate overall summary
      run: |
        echo "# 🧪 Shell Integration Testing Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Results by Platform" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Status | Shells Tested |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------|---------------|" >> $GITHUB_STEP_SUMMARY
        echo "| Linux | ${{ needs.test-shells-linux.result == 'success' && '✅' || '❌' }} | Bash, Zsh, Ksh, Fish, Tcsh, PowerShell, Nushell, Ion |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS | ${{ needs.test-shells-macos.result == 'success' && '✅' || '❌' }} | Bash, Zsh, Fish, PowerShell, Nushell |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows | ${{ needs.test-shells-windows.result == 'success' && '✅' || '❌' }} | PowerShell, CMD |" >> $GITHUB_STEP_SUMMARY
        echo "| Syntax | ${{ needs.syntax-verification.result == 'success' && '✅' || '❌' }} | Bash, Zsh, Fish, PowerShell |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Key Verifications" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Variable assignment and retrieval" >> $GITHUB_STEP_SUMMARY
        echo "- PATH expansion and appending" >> $GITHUB_STEP_SUMMARY
        echo "- Config-defined variable references" >> $GITHUB_STEP_SUMMARY
        echo "- PowerShell OS-aware delimiters (: Unix, ; Windows)" >> $GITHUB_STEP_SUMMARY
        echo "- Shell syntax validation" >> $GITHUB_STEP_SUMMARY
        echo "- Ion colon-separated arrays (no array export support)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Total Shells Tested: 15+" >> $GITHUB_STEP_SUMMARY
