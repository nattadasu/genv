name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Run tests
      run: go test -v ./...

  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION_NUMBER=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: Build binaries
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        LDFLAGS="-s -w -X main.version=${VERSION#v}"
        
        mkdir -p dist
        
        # Linux amd64
        GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/genv-linux-amd64 ./cmd/genv
        tar czf dist/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-linux-amd64.tar.gz -C dist genv-linux-amd64
        
        # Linux arm64
        GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/genv-linux-arm64 ./cmd/genv
        tar czf dist/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-linux-arm64.tar.gz -C dist genv-linux-arm64
        
        # macOS amd64
        GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/genv-darwin-amd64 ./cmd/genv
        tar czf dist/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-darwin-amd64.tar.gz -C dist genv-darwin-amd64
        
        # macOS arm64 (Apple Silicon)
        GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/genv-darwin-arm64 ./cmd/genv
        tar czf dist/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-darwin-arm64.tar.gz -C dist genv-darwin-arm64
        
        # Windows amd64
        GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/genv-windows-amd64.exe ./cmd/genv
        zip -j dist/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-windows-amd64.zip dist/genv-windows-amd64.exe
        
        # Windows arm64
        GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/genv-windows-arm64.exe ./cmd/genv
        zip -j dist/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-windows-arm64.zip dist/genv-windows-arm64.exe

    - name: Generate checksums
      run: |
        cd dist
        sha256sum *.tar.gz *.zip > checksums.txt
        cat checksums.txt

    - name: Generate release notes
      id: release_notes
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        
        # Extract changelog for this version
        if [ -f CHANGELOG.md ]; then
          awk "/## \[${{ steps.get_version.outputs.VERSION_NUMBER }}\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > release_notes.md
        else
          echo "Release $VERSION" > release_notes.md
        fi
        
        # Add download instructions
        cat >> release_notes.md << 'EOF'
        
        ## Installation
        
        ### Linux
        ```bash
        # AMD64
        wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-linux-amd64.tar.gz
        tar xzf genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-linux-amd64.tar.gz
        sudo mv genv-linux-amd64 /usr/local/bin/genv
        
        # ARM64
        wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-linux-arm64.tar.gz
        tar xzf genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-linux-arm64.tar.gz
        sudo mv genv-linux-arm64 /usr/local/bin/genv
        ```
        
        ### macOS
        ```bash
        # Intel
        wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-darwin-amd64.tar.gz
        tar xzf genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-darwin-amd64.tar.gz
        sudo mv genv-darwin-amd64 /usr/local/bin/genv
        
        # Apple Silicon
        wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-darwin-arm64.tar.gz
        tar xzf genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-darwin-arm64.tar.gz
        sudo mv genv-darwin-arm64 /usr/local/bin/genv
        ```
        
        ### Windows
        Download the appropriate `.zip` file for your architecture and extract it.
        
        ## Verification
        
        Verify the checksums:
        ```bash
        sha256sum -c checksums.txt
        ```
        
        ## Supported Shells
        
        sh, bash, zsh, ksh, ash, fish, powershell (cross-platform), nushell, xonsh, csh, tcsh, cmd, ion, rc
        
        ## Quick Start
        
        ```bash
        # Create config file at ~/.genv.env (TOML format)
        # Then add to your shell config:
        eval "$(genv init bash)"
        ```
        EOF

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.tar.gz
          dist/*.zip
          dist/checksums.txt
        body_path: release_notes.md
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate workflow summary
      run: |
        echo "# Release ${{ steps.get_version.outputs.VERSION }} Published 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | Architecture | File |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|--------------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| Linux | AMD64 | genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-linux-amd64.tar.gz |" >> $GITHUB_STEP_SUMMARY
        echo "| Linux | ARM64 | genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-linux-arm64.tar.gz |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS | AMD64 | genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-darwin-amd64.tar.gz |" >> $GITHUB_STEP_SUMMARY
        echo "| macOS | ARM64 | genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-darwin-arm64.tar.gz |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows | AMD64 | genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-windows-amd64.zip |" >> $GITHUB_STEP_SUMMARY
        echo "| Windows | ARM64 | genv-${{ steps.get_version.outputs.VERSION_NUMBER }}-windows-arm64.zip |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Checksums" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat dist/checksums.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Release URL" >> $GITHUB_STEP_SUMMARY
        echo "https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
